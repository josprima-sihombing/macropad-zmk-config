# uni-split configuration.
# See https://zmk.dev/docs/development/hardware-integration/new-shield

# Columns 7 and 8 use P0.10 and P0.09, which are the nRF52840 NFC antenna
# pins by default. This makes them usable as normal GPIOs.
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable ZMK Studio (also passed as a build flag in build.yaml).
CONFIG_ZMK_STUDIO=y
